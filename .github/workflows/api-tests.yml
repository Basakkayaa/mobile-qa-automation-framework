name: API tests (Rest Assured)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily run catches changes in the public API even when the code does not change.
    - cron: "0 6 * * *"

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run API tests
        run: mvn -B -ntp test

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline@2.34.1 generate target/allure-results --clean -o target/allure-report || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: api/target/allure-report
          if-no-files-found: ignore
