name: Mobile E2E tests (Android)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [test, test:smoke, test:regression]
        default: test

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install the Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2@4.2.9

      - name: Download the latest My Demo App APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo saucelabs/my-demo-app-rn --pattern '*.apk' --dir apps/download
          mv "$(ls apps/download/*.apk | head -n 1)" apps/my-demo-app.apk
          ls -la apps

      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: npm run ${{ github.event.inputs.suite || 'test' }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-allure-report
          path: mobile/allure-report
          if-no-files-found: ignore

      - name: Upload failure screenshots, page sources and Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-artifacts
          path: mobile/artifacts
          if-no-files-found: ignore
